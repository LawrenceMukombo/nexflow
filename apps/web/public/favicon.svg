<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amberFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyanFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="6" />

  <!-- Background Aura -->
  <circle cx="170" cy="256" r="110" fill="#f59e0b" opacity="0.12" filter="url(#glow)" />
  <circle cx="342" cy="256" r="110" fill="#0284c7" opacity="0.15" filter="url(#glow)" />

  <!-- Left Amber Circuit Column (N-Stem 1) -->
  <rect x="144" y="130" width="28" height="252" rx="14" fill="none" stroke="url(#amberFlow)" stroke-width="12" filter="url(#glow)" />
  <circle cx="158" cy="150" r="7" fill="#ffffff" />
  <circle cx="158" cy="256" r="7" fill="#fbbf24" />
  <circle cx="158" cy="362" r="7" fill="#ffffff" />

  <!-- Right Cyan Circuit Column (N-Stem 2) -->
  <rect x="340" y="130" width="28" height="252" rx="14" fill="none" stroke="url(#cyanFlow)" stroke-width="12" filter="url(#glow)" />
  <circle cx="354" cy="150" r="7" fill="#ffffff" />
  <circle cx="354" cy="256" r="7" fill="#38bdf8" />
  <circle cx="354" cy="362" r="7" fill="#ffffff" />

  <!-- Glowing Infinity-Flow Diagonal Bridge -->
  <path d="M 158 190 C 230 190, 280 322, 354 322 C 400 322, 420 280, 390 240 C 350 190, 260 322, 210 322 C 160 322, 120 270, 158 190 Z" 
        fill="none" 
        stroke="url(#cyanFlow)" 
        stroke-width="12" 
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <path d="M 354 322 C 280 322, 230 190, 158 190 C 110 190, 90 232, 122 272 C 162 322, 252 190, 302 190 C 352 190, 392 242, 354 322 Z" 
        fill="none" 
        stroke="url(#amberFlow)" 
        stroke-width="8" 
        stroke-linecap="round" 
        opacity="0.9" />

  <!-- Center Convergence Quantum Node -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" filter="url(#glow)" />
  <circle cx="256" cy="256" r="4" fill="#38bdf8" />
</svg>
